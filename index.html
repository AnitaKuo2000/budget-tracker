<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#111827" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Budget" />
<meta name="mobile-web-app-capable" content="yes" />
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icon-180.png" />
<title>Budget</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--text:#111827;--muted:#6b7280;--line:#e5e7eb;--good:#047857;--bad:#b91c1c;--accent:#2563eb}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",sans-serif;background:var(--bg);color:var(--text);min-height:100vh;min-height:100dvh;overscroll-behavior-y:none}
.wrap{max-width:760px;margin:auto;padding:calc(18px + env(safe-area-inset-top)) 14px calc(60px + env(safe-area-inset-bottom))}
.title{font-size:28px;font-weight:800;margin:6px 0 4px}.sub{color:var(--muted);margin-bottom:18px;line-height:1.45}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 4px 18px rgba(0,0,0,.04)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.metric{padding:12px;border-radius:14px;background:#f9fafb}.metric b{display:block;font-size:22px;margin-top:3px}.metric span{font-size:12px;color:var(--muted)}
label{font-size:13px;color:var(--muted);display:block;margin-bottom:6px}input,button{font:inherit}input{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;background:white;font-size:16px;color:var(--text)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.btn{border:0;border-radius:12px;padding:12px 14px;background:var(--accent);color:#fff;font-weight:700;min-height:46px}.btn.secondary{background:#111827}.btn.danger{background:#fff;color:var(--bad);border:1px solid #fecaca}
.entry{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}.entry:last-child{border-bottom:0}.entry .date{font-weight:700}.entry .note{color:var(--muted);font-size:13px;line-height:1.5}.money{font-weight:800}.good{color:var(--good)!important}.bad{color:var(--bad)!important}
.small{font-size:12px;color:var(--muted);line-height:1.45}.bar{height:10px;border-radius:999px;background:#e5e7eb;overflow:hidden;margin-top:8px}.fill{height:100%;background:#2563eb;width:0%}
.install-hint{display:none}
@media(display-mode:standalone){.install-hint{display:none!important}}
@media(max-width:520px){.grid,.row{grid-template-columns:1fr}.title{font-size:24px}.wrap{padding-left:12px;padding-right:12px}.card{border-radius:16px}}
</style>
</head>
<body><div class="wrap">
<div class="title">Budget Tracker</div>
<div class="sub">月預算 → 每日額度 → 每日花費 → 週/月平均。沒花掉的額度會自動累積成「賺到」。</div>

<div class="card install-hint" id="installHint"><div class="small">在 iPhone Safari 點「分享」→「加入主畫面」，之後可全螢幕開啟。</div></div>

<div class="card">
  <div class="row">
    <div><label>每月 Budget ($)</label><input id="budget" type="number" min="0" step="0.01" value="1000" inputmode="decimal"></div>
    <div><label>本月固定費用，例如水電網 ($)</label><input id="fixed" type="number" min="0" step="0.01" value="200" inputmode="decimal"></div>
  </div>
  <div style="margin-top:10px"><button class="btn secondary" id="saveSettings">儲存設定</button></div>
  <div class="small" style="margin-top:8px">每日額度 =（月 Budget − 固定費用）÷ 當月天數</div>
</div>

<div class="card"><div class="grid">
  <div class="metric"><span>本月每日額度</span><b id="dailyAllowance">$0</b></div>
  <div class="metric"><span>今天已花</span><b id="todaySpent">$0</b></div>
  <div class="metric"><span>今天賺到 / 超支</span><b id="todayDelta">$0</b></div>
  <div class="metric"><span>本月剩餘可用</span><b id="remaining">$0</b></div>
</div><div class="bar"><div class="fill" id="progress"></div></div></div>

<div class="card">
  <h3 style="margin-top:0">新增花費</h3>
  <div class="row">
    <div><label>日期</label><input id="date" type="date"></div>
    <div><label>金額 ($)</label><input id="amount" type="number" min="0" step="0.01" placeholder="13.22" inputmode="decimal"></div>
  </div>
  <div style="margin-top:10px"><label>備註（可選）</label><input id="note" placeholder="Lyft / groceries / dinner..." autocomplete="off"></div>
  <div style="margin-top:10px"><button class="btn" id="add">加入</button></div>
</div>

<div class="card"><div class="grid">
  <div class="metric"><span>最近 7 天平均花費 / 天</span><b id="weekAvg">$0</b></div>
  <div class="metric"><span>本月平均花費 / 天</span><b id="monthAvg">$0</b></div>
  <div class="metric"><span>最近 7 天總花費</span><b id="weekTotal">$0</b></div>
  <div class="metric"><span>本月總花費</span><b id="monthTotal">$0</b></div>
</div></div>

<div class="card"><h3 style="margin-top:0">每日紀錄</h3><div id="entries"></div></div>
<div class="card"><button class="btn danger" id="clearMonth">清除本月紀錄</button><div class="small" style="margin-top:8px">資料只存在你這台裝置的瀏覽器 Local Storage，不會上傳。</div></div>
</div>
<script>
const $=id=>document.getElementById(id);const key='budgetTrackerV1';
function todayISO(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function load(){try{return JSON.parse(localStorage.getItem(key)||'{"budget":1000,"fixed":200,"entries":[]}')}catch{return {budget:1000,fixed:200,entries:[]}}}
function save(s){localStorage.setItem(key,JSON.stringify(s))}
function money(n){return '$'+Number(n||0).toFixed(2)}
function daysInMonth(d=new Date()){return new Date(d.getFullYear(),d.getMonth()+1,0).getDate()}
function sameMonth(ds,d=new Date()){const x=new Date(ds+'T12:00:00');return x.getFullYear()===d.getFullYear()&&x.getMonth()===d.getMonth()}
function render(){const s=load();$('budget').value=s.budget;$('fixed').value=s.fixed;$('date').value=$('date').value||todayISO();
 const now=new Date(), dim=daysInMonth(now), spendable=Math.max(0,s.budget-s.fixed), allowance=spendable/dim;
 const monthEntries=s.entries.filter(e=>sameMonth(e.date,now)); const monthTotal=monthEntries.reduce((a,e)=>a+Number(e.amount),0);
 const today=todayISO(); const todaySpent=monthEntries.filter(e=>e.date===today).reduce((a,e)=>a+Number(e.amount),0); const delta=allowance-todaySpent;
 const dayOfMonth=now.getDate(); const monthAvg=dayOfMonth?monthTotal/dayOfMonth:0;
 const start7=new Date(now); start7.setHours(0,0,0,0); start7.setDate(start7.getDate()-6);
 const endToday=new Date(now); endToday.setHours(23,59,59,999);
 const weekEntries=s.entries.filter(e=>{const d=new Date(e.date+'T12:00:00');return d>=start7&&d<=endToday}); const weekTotal=weekEntries.reduce((a,e)=>a+Number(e.amount),0); const weekAvg=weekTotal/7;
 $('dailyAllowance').textContent=money(allowance);$('todaySpent').textContent=money(todaySpent);$('todayDelta').textContent=(delta>=0?'+':'-')+money(Math.abs(delta));$('todayDelta').className=delta>=0?'good':'bad';
 const remaining=spendable-monthTotal;$('remaining').textContent=money(remaining);$('remaining').className=remaining>=0?'good':'bad';$('weekAvg').textContent=money(weekAvg);$('monthAvg').textContent=money(monthAvg);$('weekTotal').textContent=money(weekTotal);$('monthTotal').textContent=money(monthTotal);
 $('progress').style.width=Math.min(100,spendable?monthTotal/spendable*100:0)+'%';
 const byDay={};monthEntries.forEach(e=>{(byDay[e.date]??=[]).push(e)}); const dates=Object.keys(byDay).sort().reverse();
 $('entries').innerHTML=dates.length?'':`<div class="small">本月還沒有紀錄。</div>`;
 dates.forEach(dt=>{const total=byDay[dt].reduce((a,e)=>a+Number(e.amount),0), diff=allowance-total;const div=document.createElement('div');div.className='entry';div.innerHTML=`<div><div class="date">${dt}</div><div class="note">${byDay[dt].map(e=>`${escapeHtml(e.note||'Expense')} ${money(e.amount)}`).join(' · ')}</div></div><div style="text-align:right"><div class="money">${money(total)}</div><div class="small ${diff>=0?'good':'bad'}">${diff>=0?'賺到 ':'超支 '}${money(Math.abs(diff))}</div></div>`;$('entries').appendChild(div)});
}
function escapeHtml(str){return String(str).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
$('saveSettings').onclick=()=>{const s=load();s.budget=Number($('budget').value)||0;s.fixed=Number($('fixed').value)||0;save(s);render()};
$('add').onclick=()=>{const a=Number($('amount').value);if(!a||a<0)return alert('請輸入花費金額');const s=load();s.entries.push({id:Date.now(),date:$('date').value||todayISO(),amount:a,note:$('note').value.trim()});save(s);$('amount').value='';$('note').value='';render()};
$('clearMonth').onclick=()=>{if(!confirm('確定要清除本月所有紀錄嗎？'))return;const s=load();s.entries=s.entries.filter(e=>!sameMonth(e.date,new Date()));save(s);render()};
if(!window.matchMedia('(display-mode: standalone)').matches && !navigator.standalone){$('installHint').style.display='block'}
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}))}
render();
</script></body></html>
